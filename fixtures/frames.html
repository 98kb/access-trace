<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accessibility Inspector fixture — frames</title>
    <style>
      body {
        margin: 0;
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 760px;
        margin: auto;
        padding: 32px 24px;
      }
      iframe {
        width: 100%;
        height: 180px;
        border: 1px solid #9ca3af;
      }
    </style>
  </head>
  <body data-expected-violations="image-alt">
    <main>
      <h1>Frames fixture</h1>
      <p>
        The first frame is same-origin and scannable. The second is served from
        a different origin on the same host machine, so it must be reported as
        skipped rather than scanned.
      </p>
      <img id="top-missing-alt" src="data:," width="40" height="40" />
      <h2>Same-origin frame</h2>
      <iframe
        id="same-origin"
        title="Same-origin frame"
        src="./frame-child.html"
      ></iframe>
      <h2>Cross-origin frame</h2>
      <iframe
        id="cross-origin"
        title="Cross-origin frame"
        src="http://localhost:4173/frame-child.html"
      ></iframe>
    </main>
  </body>
</html>
